# Einziger Eingang des Docker-Stacks: Angular-Oberfläche + Weiterleitung /api an die Express-API.
# Die API läuft im selben Netzwerk-Namensraum und lauscht nur auf 127.0.0.1:3000.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 4201;
  server_name localhost 127.0.0.1;

  # CV-Importe senden bis zu 15 MB JSON.
  client_max_body_size 20m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # Host und Origin unverändert durchreichen: Die API akzeptiert nur localhost/127.0.0.1/[::1]
    # (Schutz gegen DNS-Rebinding), und genau das schickt der Browser auf dem Mac.
    proxy_set_header Host $http_host;

    # Realtime-Kanal der Agentenläufe (WebSocket).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Server-Sent Events und lange Agentenläufe nicht puffern oder abbrechen.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
