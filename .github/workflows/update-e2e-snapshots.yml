name: update-e2e-snapshots

# Erzeugt die Playwright-Screenshot-Baselines auf demselben Ubuntu-Runner wie die CI
# und committet sie auf den gewählten Branch. Danach wird die CI für diesen Branch neu gestartet.
# Start: Actions → update-e2e-snapshots → Run workflow → Branch wählen.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test --update-snapshots
        working-directory: web
        continue-on-error: true
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/e2e/*-snapshots
          if git diff --cached --quiet; then echo "Keine Änderungen an den Baselines."; exit 0; fi
          git commit -m "test(e2e): refresh Playwright baselines on the CI runner"
          git push
      - name: Restart CI for this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
