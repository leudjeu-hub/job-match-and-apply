# Vollständiger Stack: docker compose up -d --build  →  http://localhost:4201
# Beenden:            docker compose down
#
# Der Port wird nur auf 127.0.0.1 des Rechners freigegeben, nie im Netzwerk. Daten liegen wie beim
# normalen Start in .local-data/ und .application-work/ dieses Ordners (beide von Git ausgeschlossen).

name: job-match-and-apply

services:
  api:
    build:
      context: .
      target: api
    image: job-match-and-apply-api:local
    init: true
    restart: unless-stopped
    environment:
      PORT: "3000"
      ALLOW_EXTERNAL_PORTALS: "0"
    volumes:
      - ./.local-data:/app/.local-data
      - ./.application-work:/app/.application-work
    # Einziger veröffentlichter Port gehört zum web-Dienst, der diesen Netzwerk-Namensraum teilt.
    ports:
      - "127.0.0.1:4201:4201"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      target: web
    image: job-match-and-apply-web:local
    restart: unless-stopped
    network_mode: "service:api"
    depends_on:
      api:
        condition: service_healthy
